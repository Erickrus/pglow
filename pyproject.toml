[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pglow"
version = "0.1.0"
description = "A cross-platform terminal Markdown reader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pglow" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

[project.scripts]
pglow = "pglow:main"

[tool.setuptools.packages.find]
where = ["src"]
